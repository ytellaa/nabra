name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions (lance aussi les tests de compatibilité)

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  android:
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: app/android
      - uses: actions/upload-artifact@v7
        with:
          name: nabra-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  # Tests de compatibilité : l'APK est installé sur des émulateurs Android de plusieurs versions,
  # puis Maestro joue les scénarios de app/.maestro/. Voir COMPATIBILITY.md.
  # Lancés sur les tags de release (vX.Y.Z), les pull requests (dont Dependabot) et à la demande.
  compat:
    name: compat · Android ${{ matrix.android }} (API ${{ matrix.api-level }})
    needs: android
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false # une version en échec n'arrête pas les autres
      matrix:
        # flows : scénarios à jouer. Les images API 24 et 28 ont une WebView d'origine trop ancienne
        # (avant Chrome 80) : on vérifie que Nabra affiche le message « Mise à jour nécessaire ».
        include:
          - { api-level: 24, android: '7.0', flows: app/.maestro/webview-ancienne } # minSdk
          - { api-level: 28, android: '9', flows: app/.maestro/webview-ancienne }
          - { api-level: 31, android: '12', flows: app/.maestro }
          - { api-level: 34, android: '14', flows: app/.maestro }
          - { api-level: 36, android: '16', flows: app/.maestro } # targetSdk
    env:
      MAESTRO_VERSION: 2.12.1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nabra-debug-apk

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Accélération matérielle des émulateurs sur les runners Linux
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Installer Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Cache de l'émulateur déjà démarré (snapshot) : évite de le recréer à chaque run
      - name: Cache de l'émulateur
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-google_apis-x86_64

      - name: Créer le snapshot de l'émulateur
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot créé"

      - name: Lancer les scénarios Maestro
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # La WebView de l'émulateur est celle d'origine de l'image (jamais mise à jour) : c'est le pire cas.
          script: |
            echo "WebView API ${{ matrix.api-level }} : $(adb shell "dumpsys webviewupdate | grep -i 'current webview package' || dumpsys package com.android.webview | grep -m1 versionName")" | tee -a "$GITHUB_STEP_SUMMARY"
            adb install -r app-debug.apk
            maestro test ${{ matrix.flows }} --format junit --output maestro-report.xml --test-output-dir maestro-output

      - name: Résumé
        if: always()
        run: |
          if [ -f maestro-report.xml ]; then
            tests=$(grep -o 'tests="[0-9]*"' maestro-report.xml | head -1 | grep -o '[0-9]*')
            failures=$(grep -o 'failures="[0-9]*"' maestro-report.xml | head -1 | grep -o '[0-9]*')
            echo "### Android ${{ matrix.android }} (API ${{ matrix.api-level }}) : $((tests - failures))/$tests scénarios OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Android ${{ matrix.android }} (API ${{ matrix.api-level }}) : pas de rapport (émulateur ou installation en échec)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Captures et rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-api-${{ matrix.api-level }}
          path: |
            maestro-report.xml
            maestro-output/
          if-no-files-found: ignore
