version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      capacitor:
        patterns: ['@capacitor/*', '@capacitor-*', '@capgo/*']
    ignore:
      # Types alignés sur la version de Node de la CI (22) : pas de saut de version majeure.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
